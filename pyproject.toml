[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chris-hermes-agent"
version = "0.2.0"
description = "Agent-managed context handoff for long-running Hermes tasks"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Chrischenny"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "PyYAML>=6.0",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["chris_hermes_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["chris_hermes_agent"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["chris_hermes_agent"]
explicit_package_bases = true
[[tool.mypy.overrides]]
module = "agent.*"
ignore_missing_imports = true
